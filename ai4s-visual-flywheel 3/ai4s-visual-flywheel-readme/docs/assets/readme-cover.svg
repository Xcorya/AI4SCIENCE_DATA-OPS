<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
  <title id="title">AI4Science Visual Flywheel</title>
  <desc id="desc">Evidence-grounded curation for scientific images and videos. Collect, verify, calibrate, and construct training tasks.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d172b"/><stop offset="1" stop-color="#172847"/></linearGradient>
    <linearGradient id="line" x2="1"><stop stop-color="#6ce4d0"/><stop offset="1" stop-color="#a69df8"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7386a4" opacity=".16"/></pattern>
  </defs>
  <rect width="1440" height="440" rx="20" fill="url(#bg)"/>
  <rect width="1440" height="440" rx="20" fill="url(#dots)"/>
  <path d="M0 439H1440" stroke="url(#line)" stroke-width="3"/>
  <g transform="translate(65 60)" fill="none" stroke="#83e2d0"><circle r="23"/><circle r="15" opacity=".65"/><circle r="7" opacity=".9"/></g>
