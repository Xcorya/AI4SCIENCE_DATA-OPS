[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-visual-flywheel"
version = "0.1.1"
description = "Evidence policy reference for AI4Science image/video labeling"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
visual-flywheel = "visual_flywheel.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
